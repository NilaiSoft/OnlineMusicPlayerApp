<!DOCTYPE html>
<html>
<head>
    <meta charset='UTF-8'>
    <title>نیاز به اتصال اینترنت</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #f8f8f8;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Tahoma', sans-serif;
        }

        .message {
            text-align: center;
            padding: 30px;
            background-color: #ffffff;
            border-radius: 15px;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
        }

            .message h2 {
                color: #ff4444;
                font-size: 24px;
                margin-bottom: 10px;
            }

            .message p {
                color: #555555;
                font-size: 18px;
            }
    </style>
</head>
<body>
    <div class='message'>
        <h2>اتصال اینترنت مورد نیاز است</h2>
        <p>برای ادامه، لطفاً اینترنت خود را فعال کنید.</p>
    </div>
</body>
</html>
</html>
